:root{--bg:#F5F8F4;--card:#FFFFFF;--ink:#1F2A24;--mut:#66736B;--line:#DCE5DD;--pis:#4F7A5A;--pis2:#E3EEE4;--saf:#E0A526;--saf2:#FBF1D6;--rose:#C2456F;--rose2:#F9E3EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.55}

.logo small{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}

header select{width:auto;font-weight:700}

h2{font-size:18px;margin:0 0 10px}
.muted{color:var(--mut);font-size:14px}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--saf2);border:1px solid var(--saf);display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner b{display:block}
.btn{background:var(--pis);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.alt{background:var(--pis2);color:var(--pis)}
.btn.warn{background:var(--rose2);color:var(--rose)}
.btn.full{width:100%;margin-top:8px}
.status{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.status:last-child{border:0}
.pill{border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.ok{background:var(--pis2);color:var(--pis)}
.no{background:var(--saf2);color:#8A6200}.bad{background:var(--rose2);color:var(--rose)}.tr4{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
@media (prefers-color-scheme:dark){.no{color:var(--saf)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pis2);color:var(--pis);border:1px solid transparent;border-radius:99px;padding:7px 14px;font-weight:500;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.grid3{display:grid;grid-template-columns:1fr 1fr 78px;gap:8px;align-items:end;margin-bottom:10px}
.grid3 label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:3px}
.diff{font-weight:800;text-align:center;padding-bottom:10px}
.diff.neg{color:var(--rose)}.diff.zero{color:var(--pis)}.diff.pos{color:#8A6200}
.name{font-weight:700;margin:2px 0 6px}
.photo{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;line-height:1.3;position:relative;background:none;border:0;padding:8px 2px;font-size:13px;font-weight:500;color:var(--mut);cursor:pointer;border-radius:10px}
nav button.on{color:var(--pis);font-weight:800;background:var(--pis2)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:700;z-index:20}
.day{margin-bottom:12px}
.day h3{margin:0 0 6px;font-size:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:17px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);padding:2px 2px 10px}.topbar b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 12px}.tbl th,.tbl td{border:1px solid var(--line);padding:7px 8px;text-align:start;vertical-align:top;word-break:break-word}.tbl th{background:var(--pis2);color:var(--pis);font-weight:700}.tbl tfoot td{background:var(--bg);font-weight:800}
.share{--bg:#fff;--card:#fff;--ink:#1F2A24;--mut:#66736B;--line:#C9D4CB;--pis:#4F7A5A;--pis2:#E3EEE4;--saf:#E0A526;--saf2:#FBF1D6;--rose:#C2456F;--rose2:#F9E3EB;background:#fff;color:#1F2A24;font-family:"Tajawal",system-ui,sans-serif}.share .no{color:#8A6200}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;overflow:auto;padding:16px}.mbox{background:var(--card);border-radius:14px;padding:12px;max-width:560px;margin:0 auto;text-align:center}
:root{--gold:#8A6A33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#D2B07A}}
.topbar2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.tb1{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;color:var(--gold);line-height:1.2}
.phrase{font-size:13px;color:var(--mut);line-height:1.35}
.tb2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.tb2 b{color:var(--ink)}.tb2 .emp{margin-inline-start:auto}

function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function r2(x){return Math.round(x*100)/100}
function lineAmt(x){var q=(x.qty===undefined||x.qty==='')?1:num(x.qty);return num(x.amt)*q}
function sums(b){var a=0,s=0;CH.forEach(function(c){a+=num(b[c]);s+=num(b['s'+c])});
  var e=(b.exp||[]).reduce(function(t,x){return t+num(x.amt)},0),p=(b.purch||[]).reduce(function(t,x){return t+num(x.amt)},0);
  var u=(b.unreg||[]).reduce(function(t,x){return t+lineAmt(x)},0);
  var rt=(b.ret||[]).reduce(function(t,x){return t+num(x.amt)*(x.qty===undefined||x.qty===''?1:num(x.qty))},0);
  return {a:r2(a),s:r2(s),e:r2(e),p:r2(p),u:r2(u),rt:r2(rt),d:r2(a+e-u-s)}}
function dword(t){if(!t.a&&!t.s&&!t.e)return '—';return t.d<0?'عجز '+Math.abs(t.d):(t.d>0?'فائض '+t.d:'متطابق')}

function allDays(){var s={};Object.keys(S.orders).concat(Object.keys(S.bal)).forEach(function(k){s[k]=1});return Object.keys(s).sort().reverse()}
var rMode='week',rOff=0;
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rangeDays(){var n=bizNow(),s,e;
  if(rMode==='day'){s=new Date(n.getFullYear(),n.getMonth(),n.getDate()+rOff);e=s}
  else if(rMode==='week'){var dow=(n.getDay()+1)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow+rOff*7);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6)}
  else{s=new Date(n.getFullYear(),n.getMonth()+rOff,1);e=new Date(s.getFullYear(),s.getMonth()+1,0)}
  var o=[];for(var d=new Date(s);d<=e;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))o.push(key(d));return o}
function rSet(m){rMode=m;rOff=0;render()}
function rMove(n){if(rOff+n>0)return;rOff+=n;render()}
function ctl(days){
  var h='<div class="card"><div class="row">';
  [['day','يومي'],['week','أسبوعي'],['month','شهري']].forEach(function(m){h+='<button class="btn '+(rMode===m[0]?'':'alt')+'" style="flex:1" onclick="rSet(\''+m[0]+'\')">'+m[1]+'</button>'});
  h+='</div><div class="row" style="margin-top:10px;justify-content:space-between"><button class="btn alt" onclick="rMove(-1)" aria-label="السابق">›</button><b>'+(rMode==='day'?dayName(days[0]):days[0]+' إلى '+days[days.length-1])+'</b><button class="btn alt" onclick="rMove(1)" aria-label="التالي"'+(rOff>=0?' disabled style="opacity:.4"':'')+'>‹</button></div></div>';
  return h}

  var items=(inf.sent?inf.sent.items:r.items).map(function(x,i){var el=document.getElementById('dr_'+i);return {name:x.name,qty:x.qty,recv:el?el.value:x.qty}});
  S.drecv=S.drecv||{};S.drecv[id]={id:id,items:items,recipient:name,by:USERS[who].n,at:Date.now()};
  var ok=save('drecv/'+id);toast(ok?'تم تسجيل الاستلام والتسليم':'تعذر الحفظ');render();
}
function payList(name,mk){return Object.keys(S.pay||{}).map(function(k){return S.pay[k]}).filter(function(p){return p.name===name&&p.month===mk}).sort(function(a,b){return (a.at||0)-(b.at||0)})}
function payTotal(name,mk){return r2(payList(name,mk).reduce(function(t,p){return t+num(p.amt)},0))}
function payCardHtml(mk){
  if(who!=='salman')return '';
  var names=ename('salary');
  var h='<div class="card"><h2>دفعات الرواتب</h2><p class="muted" style="margin-top:-6px">سجّل كل دفعة تصرف للموظف خلال الشهر، والمتبقي يتحسب تلقائياً.</p>';
  h+=tbl(['الموظف','الراتب','المدفوع','المتبقي'],names.map(function(n){var sal=num(((S.exp||{})['salary|'+n+'|'+mk]||{}).amt),pd=payTotal(n,mk);return [esc(n),sal||'—',pd,sal?dtag(r2(sal-pd)):'—']}));
  h+='<div class="name" style="margin-top:10px">دفعة جديدة</div><select id="pay_name" style="margin-bottom:8px">'+names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('')+'</select>';
  h+='<div class="row"><input type="number" inputmode="decimal" id="pay_amt" placeholder="المبلغ"><input type="date" id="pay_date" value="'+today()+'"></div>';
  h+='<button class="btn full" onclick="savePay(\''+mk+'\')">حفظ الدفعة</button>';
  var list=Object.keys(S.pay||{}).map(function(k){return S.pay[k]}).filter(function(p){return p.month===mk}).sort(function(a,b){return (b.at||0)-(a.at||0)});
  if(list.length)h+='<div class="name" style="margin-top:12px">الدفعات هذا الشهر</div>'+list.map(function(p){return '<div class="item"><span style="flex:1">'+esc(p.name)+' - '+esc(p.date)+'<br><span class="muted">'+esc(p.by||'')+'</span></span><b>'+p.amt+'</b><button class="btn warn" style="padding:4px 8px;margin-inline-start:6px" onclick="delPay(\''+p.id+'\')">حذف</button></div>'}).join('');
  return h+'</div>';
}
function savePay(mk){
  var name=(document.getElementById('pay_name')||{}).value,amt=((document.getElementById('pay_amt')||{}).value||'').trim(),date=(document.getElementById('pay_date')||{}).value||today();
  if(!name){toast('اختر الموظف');return}
  if(!amt||!(num(amt)>0)){toast('أدخل مبلغ الدفعة');return}
  var id=newInvId();S.pay=S.pay||{};
  S.pay[id]={id:id,cat:'salary',name:name,month:mk,amt:amt,date:date,at:Date.now(),by:USERS[who].n};
  var ok=save('pay/'+id);toast(ok?'تم حفظ الدفعة':'تعذر الحفظ');render();
}
function delPay(id){
  if(!confirm('تأكيد حذف الدفعة؟'))return;
  var p=S.pay&&S.pay[id];delete S.pay[id];
  if(DBH)DBH.doc('pay/'+id).delete().catch(function(){});else save('cfg/main');
  writeLog('pay/'+id+'#delete');toast('تم الحذف');render();
}
function setPinRow(k){return '<div class="status" style="gap:8px"><span>'+USERS[k].n+'<br><span class="muted">اسم المستخدم: '+k+'</span></span><input type="password" inputmode="numeric" placeholder="رقم جديد" style="width:120px" onchange="setPin(\''+k+'\',this.value);this.value=\'\'"></div>'}

function settings(){
  var h='<div class="card"><h2>أصناف الطلبات</h2><div class="chips">';
  S.options.forEach(function(x,i){h+='<button class="chip" onclick="delOpt('+i+')" aria-label="حذف '+esc(x)+'">'+esc(x)+' ✕</button>'});
  h+='</div><div class="row" style="margin-top:12px"><input type="text" id="newopt" placeholder="صنف جديد"><button class="btn" onclick="addOpt()">إضافة</button></div></div>';
  h+='<div class="card"><h2>أوقات التنبيه</h2><div class="grid3" style="grid-template-columns:1fr 1fr"><div><label>الطلبات</label><input type="time" value="'+S.ordersTime+'" onchange="S.ordersTime=this.value;saveCfg()"></div><div><label>الموازنة</label><input type="time" value="'+S.balTime+'" onchange="S.balTime=this.value;saveCfg()"></div></div></div>';
  h+='<div class="card"><h2>الأيام الضعيفة</h2><label class="muted" style="display:block;margin-bottom:4px">تُعتبر ضعيفة إذا كانت مبيعات النظام أقل من (%) من متوسط الفترة</label><input type="number" inputmode="numeric" value="'+S.weakPct+'" onchange="S.weakPct=+this.value||70;saveCfg()"></div>';
  h+=ctlCard();h+=logCard();h+=pricesCard();h+='<div class="card"><h2>المستخدمون</h2><p class="muted" style="margin-top:-6px">لتغيير الرقم السري اكتب رقماً جديداً (4 أرقام أو أكثر)</p>'+Object.keys(USERS).map(setPinRow).join('')+'</div>';
  return h;
}
function addOpt(){var v=document.getElementById('newopt').value.trim();if(!v||S.options.indexOf(v)>-1)return;S.options.push(v);save('cfg/main');render()}
function delOpt(i){S.options.splice(i,1);save('cfg/main');render()}

function getPin(k){return (S.pins&&S.pins[k])||USERS[k].pin}

function logout(){if(DEMO){S=REAL;REAL=null;DEMO=false}who=null;screen='welcome';draft=null;render()}
function logo(sz){return '<span class="lg" role="img" aria-label="Fazh Sweet" style="width:'+sz+'px;height:'+sz+'px"></span>'}
function welcome(){return '<div style="min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="lgf" role="img" aria-label="Fazh Sweet - فازة حلا"></div><p class="muted" style="font-size:16px;margin:18px 0 18px">أهلاً بك في نظام متابعة المحل اليومية</p><button class="btn" style="padding:13px 44px;font-size:17px" onclick="screen=\'login\';render()">تسجيل الدخول</button></div>'}
function loginScreen(){var k='onkeydown="if(event.key===\'Enter\')doLogin()"';return '<div style="max-width:380px;margin:7vh auto 0;text-align:center">'+logo(76)+'<h2 style="margin:10px 0 16px">تسجيل الدخول</h2><div class="card" style="text-align:start"><label class="muted" for="lu">اسم المستخدم</label><input type="text" id="lu" autocapitalize="none" autocomplete="username" style="margin:4px 0 12px" '+k+'><label class="muted" for="lp">الرقم السري</label><input type="password" id="lp" inputmode="numeric" autocomplete="current-password" style="margin-top:4px" '+k+'><button class="btn full" onclick="doLogin()">دخول</button></div><button class="btn alt" onclick="screen=\'welcome\';render()">رجوع</button></div>'}
function render(){
  var app=document.getElementById('app'),y=window.scrollY;
  if(screen==='welcome'){app.innerHTML=topbar()+welcome();return}
  if(screen==='login'){app.innerHTML=topbar()+loginScreen();return}
  var u=USERS[who],body=(lockedBody(tab)||({home:(who==='mahmoud'?home:homeTask2),orders:orders,balance:balance,report:report,settings:settings,fentry:fentry,fact:factReport,exp:expView,inc:incView,reports:reportsHub,trans:transScreen,recv:recvScreen,flow:flowReport,delegate:delegateScreen})[tab]());
  var tabs;
  if(who==='salman')tabs=[['home','الرئيسية'],['reports','التقارير'],['flow','الطلبات والاستلام'],['exp','المصروفات'],['settings','الإعدادات']];
  else if(who==='issa')tabs=[['home','الرئيسية'],['fentry','المصنع'],['trans','الترحيل'],['delegate','المندوب'],['report','تقريري']];
  else tabs=[['home','الرئيسية'],['orders','الطلبات'],['delegate','المندوب'],['balance','الموازنة'],['recv','الاستلام']];
  var nav=tabs.length>1?'<nav><div>'+tabs.map(function(t){var on=(t[0]===tab)||(who==="salman"&&t[0]==="reports"&&["report","fact","inc"].indexOf(tab)>-1);var bd=badgeFor(t[0]);return '<button class="'+(on?'on':'')+'" onclick="go(\''+t[0]+'\')">'+(NAVICO[t[0]]?ico(NAVICO[t[0]],22)+'<br>':'')+t[1]+(bd?'<span class="dot pulse">'+bd+'</span>':'')+'</button>'}).join('')+'</div></nav>':'';
  app.innerHTML=topbar()+(DEMO?demoBanner():'')+backBtn()+body+nav;
  window.scrollTo(0,y);
}
render();setInterval(function(){if(screen==='app'&&tab==='home')render()},60000);setInterval(tick,15000);setInterval(alertsTick,20000);initDb();;
</script>
